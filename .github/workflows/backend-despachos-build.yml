name: Build & Push Backend Despachos

on:
  push:
    branches: ["deploy"]

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: TU_USUARIO_DOCKERHUB # ⚠️ CAMBIAR
  BACK_IMAGE: despachos-backend

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
          | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build backend despachos image
        run: |
          docker build \
          -f back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile \
          -t ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BACK_IMAGE }}:latest \
          back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

      - name: Push backend despachos image
        run: |
          docker push ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BACK_IMAGE }}:latest