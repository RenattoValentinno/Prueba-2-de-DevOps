version: "3.8"

services:

  back_ventas:
    container_name: back_ventas
    build: ./back-Ventas_SpringBoot/Springboot-API-REST

    ports:
      - "8082:8082"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://10.0.152.242:3306/sistema
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

    restart: always

  back_despachos:
    container_name: back_despachos
    build: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://10.0.152.242:3306/sistema
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

    restart: always

  frontend:
    container_name: frontend
    build: ./front_despacho

    ports:
      - "5173:5173"

    depends_on:
      - back_ventas
      - back_despachos

    restart: always

  mysql:
    container_name: mysql_db
    image: mysql:8

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: